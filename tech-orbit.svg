<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="520"
     viewBox="0 0 1200 520">

  <defs>

    <linearGradient id="bg"
      x1="0" y1="0"
      x2="1" y2="1">

      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>

    </linearGradient>

    <radialGradient id="core">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow"
      x="-50%" y="-50%"
      width="200%" height="200%">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    width="1200"
    height="520"
    rx="28"
    fill="url(#bg)"
  />


  <!-- Background grid -->

  <g
    opacity="0.055"
    stroke="#64748b"
    stroke-width="1">

    <path d="M0 80 H1200"/>
    <path d="M0 160 H1200"/>
    <path d="M0 240 H1200"/>
    <path d="M0 320 H1200"/>
    <path d="M0 400 H1200"/>
    <path d="M0 480 H1200"/>

    <path d="M100 0 V520"/>
    <path d="M200 0 V520"/>
    <path d="M300 0 V520"/>
    <path d="M400 0 V520"/>
    <path d="M500 0 V520"/>
    <path d="M600 0 V520"/>
    <path d="M700 0 V520"/>
    <path d="M800 0 V520"/>
    <path d="M900 0 V520"/>
    <path d="M1000 0 V520"/>
    <path d="M1100 0 V520"/>

  </g>


  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <text
    x="60"
    y="58"
    fill="#67e8f9"
    font-size="10"
    letter-spacing="4"
    font-family="Arial, Helvetica, sans-serif">

    TECH ORBIT

  </text>


  <text
    x="60"
    y="94"
    fill="#f8fafc"
    font-size="26"
    font-weight="bold"
    font-family="Arial, Helvetica, sans-serif">

    Technologies I Build With

  </text>


  <text
    x="60"
    y="120"
    fill="#64748b"
    font-size="10"
    font-family="Arial, Helvetica, sans-serif">

    FRONTEND • BACKEND • DATABASES • AI/ML • TOOLS

  </text>


  <!-- ================================================= -->
  <!-- ORBIT SYSTEM -->
  <!-- ================================================= -->

  <g transform="translate(600 300)">


    <!-- central glow -->

    <circle
      r="145"
      fill="url(#core)"
    />


    <!-- orbit 1 -->

    <ellipse
      rx="255"
      ry="105"
      fill="none"
      stroke="#1e3a8a"
      stroke-width="1.5"
      opacity="0.8"
    />


    <!-- orbit 2 -->

    <ellipse
      rx="190"
      ry="190"
      fill="none"
      stroke="#312e81"
      stroke-width="1"
      opacity="0.8"
      transform="rotate(35)"
    />


    <!-- orbit 3 -->

    <ellipse
      rx="125"
      ry="225"
      fill="none"
      stroke="#164e63"
      stroke-width="1"
      opacity="0.8"
      transform="rotate(-35)"
    />


    <!-- center -->

    <circle
      r="78"
      fill="#020617"
      stroke="#06b6d4"
      stroke-width="2"
      filter="url(#glow)"
    />

    <circle
      r="66"
      fill="#0f172a"
      stroke="#1e3a8a"
      stroke-width="1"
    />


    <text
      x="0"
      y="-8"
      text-anchor="middle"
      fill="#67e8f9"
      font-size="12"
      font-weight="bold"
      letter-spacing="2"
      font-family="Arial, Helvetica, sans-serif">

      FULL STACK

    </text>


    <text
      x="0"
      y="15"
      text-anchor="middle"
      fill="#64748b"
      font-size="9"
      font-family="Arial, Helvetica, sans-serif">

      DEVELOPER

    </text>


    <!-- ================================================= -->
    <!-- TECHNOLOGY NODES -->
    <!-- ================================================= -->


    <!-- React -->

    <g transform="translate(-255 -105)">

      <circle r="31"
        fill="#0f172a"
        stroke="#06b6d4"
        stroke-width="1.5"/>

      <circle r="4"
        fill="#06b6d4"
        filter="url(#glow)"/>

      <text
        y="52"
        text-anchor="middle"
        fill="#67e8f9"
        font-size="10"
        font-weight="bold"
        font-family="Arial">

        React

      </text>

    </g>


    <!-- Next.js -->

    <g transform="translate(255 -105)">

      <circle r="31"
        fill="#0f172a"
        stroke="#a78bfa"
        stroke-width="1.5"/>

      <text
        y="5"
        text-anchor="middle"
        fill="#f8fafc"
        font-size="11"
        font-weight="bold"
        font-family="Arial">

        Next

      </text>

      <text
        y="52"
        text-anchor="middle"
        fill="#c4b5fd"
        font-size="10"
        font-weight="bold"
        font-family="Arial">

        Next.js

      </text>

    </g>


    <!-- TypeScript -->

    <g transform="translate(-190 190)">

      <circle r="31"
        fill="#0f172a"
        stroke="#2563eb"
        stroke-width="1.5"/>

      <text
        y="5"
        text-anchor="middle"
        fill="#60a5fa"
        font-size="12"
        font-weight="bold"
        font-family="Arial">

        TS

      </text>

      <text
        y="52"
        text-anchor="middle"
        fill="#60a5fa"
        font-size="10"
        font-weight="bold"
        font-family="Arial">

        TypeScript

      </text>

    </g>


    <!-- Node -->

    <g transform="translate(190 190)">

      <circle r="31"
        fill="#0f172a"
        stroke="#10b981"
        stroke-width="1.5"/>

      <text
        y="5"
        text-anchor="middle"
        fill="#34d399"
        font-size="12"
        font-weight="bold"
        font-family="Arial">

        JS

      </text>

      <text
        y="52"
        text-anchor="middle"
        fill="#34d399"
        font-size="10"
        font-weight="bold"
        font-family="Arial">

        Node.js

      </text>

    </g>


    <!-- PostgreSQL -->

    <g transform="translate(-125 -225)">

      <circle r="31"
        fill="#0f172a"
        stroke="#38bdf8"
        stroke-width="1.5"/>

      <text
        y="5"
        text-anchor="middle"
        fill="#38bdf8"
        font-size="10"
        font-weight="bold"
        font-family="Arial">

        PG

      </text>

      <text
        y="52"
        text-anchor="middle"
        fill="#38bdf8"
        font-size="10"
        font-weight="bold"
        font-family="Arial">

        PostgreSQL

      </text>

    </g>


    <!-- MongoDB -->

    <g transform="translate(125 -225)">

      <circle r="31"
        fill="#0f172a"
        stroke="#10b981"
        stroke-width="1.5"/>

      <text
        y="5"
        text-anchor="middle"
        fill="#34d399"
        font-size="11"
        font-weight="bold"
        font-family="Arial">

        M

      </text>

      <text
        y="52"
        text-anchor="middle"
        fill="#34d399"
        font-size="10"
        font-weight="bold"
        font-family="Arial">

        MongoDB

      </text>

    </g>


    <!-- Python -->

    <g transform="translate(-325 20)">

      <circle r="31"
        fill="#0f172a"
        stroke="#f59e0b"
        stroke-width="1.5"/>

      <text
        y="5"
        text-anchor="middle"
        fill="#fbbf24"
        font-size="11"
        font-weight="bold"
        font-family="Arial">

        Py

      </text>

      <text
        y="52"
        text-anchor="middle"
        fill="#fbbf24"
        font-size="10"
        font-weight="bold"
        font-family="Arial">

        Python

      </text>

    </g>


    <!-- Tailwind -->

    <g transform="translate(325 20)">

      <circle r="31"
        fill="#0f172a"
        stroke="#06b6d4"
        stroke-width="1.5"/>

      <text
        y="5"
        text-anchor="middle"
        fill="#22d3ee"
        font-size="11"
        font-weight="bold"
        font-family="Arial">

        TW

      </text>

      <text
        y="52"
        text-anchor="middle"
        fill="#22d3ee"
        font-size="10"
        font-weight="bold"
        font-family="Arial">

        Tailwind

      </text>

    </g>


  </g>


  <!-- ================================================= -->
  <!-- FOOTER LABEL -->
  <!-- ================================================= -->

  <text
    x="600"
    y="495"
    text-anchor="middle"
    fill="#475569"
    font-size="8"
    letter-spacing="2"
    font-family="Arial, Helvetica, sans-serif">

    BUILD • SHIP • LEARN • REPEAT

  </text>


  <!-- corners -->

  <path
    d="M30 70 V30 H70"
    fill="none"
    stroke="#06b6d4"
    stroke-width="2"
  />

  <path
    d="M1170 450 V490 H1130"
    fill="none"
    stroke="#a855f7"
    stroke-width="2"
  />

</svg>