<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="560"
     viewBox="0 0 1200 560">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <radialGradient id="core">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow"
            x="-50%" y="-50%"
            width="200%" height="200%">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    width="1200"
    height="560"
    rx="28"
    fill="url(#bg)"
  />

  <g
    opacity="0.05"
    stroke="#64748b"
    stroke-width="1">

    <path d="M0 80 H1200"/>
    <path d="M0 160 H1200"/>
    <path d="M0 240 H1200"/>
    <path d="M0 320 H1200"/>
    <path d="M0 400 H1200"/>
    <path d="M0 480 H1200"/>

    <path d="M100 0 V560"/>
    <path d="M200 0 V560"/>
    <path d="M300 0 V560"/>
    <path d="M400 0 V560"/>
    <path d="M500 0 V560"/>
    <path d="M600 0 V560"/>
    <path d="M700 0 V560"/>
    <path d="M800 0 V560"/>
    <path d="M900 0 V560"/>
    <path d="M1000 0 V560"/>
    <path d="M1100 0 V560"/>

  </g>


  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <text
    x="60"
    y="58"
    fill="#67e8f9"
    font-size="10"
    letter-spacing="4"
    font-family="Arial">

    TECH ORBIT

  </text>

  <text
    x="60"
    y="94"
    fill="#f8fafc"
    font-size="26"
    font-weight="bold"
    font-family="Arial">

    Technologies I Build With

  </text>

  <text
    x="60"
    y="120"
    fill="#64748b"
    font-size="10"
    font-family="Arial">

    FRONTEND • BACKEND • DATABASES • LANGUAGES • TOOLS

  </text>


  <!-- ================================================= -->
  <!-- ORBIT -->
  <!-- ================================================= -->

  <g transform="translate(600 325)">

    <!-- glow -->

    <circle
      r="155"
      fill="url(#core)"
    />


    <!-- orbit rings -->

    <ellipse
      rx="330"
      ry="105"
      fill="none"
      stroke="#1e3a8a"
      stroke-width="1"
      opacity="0.8"
    />

    <ellipse
      rx="280"
      ry="155"
      fill="none"
      stroke="#312e81"
      stroke-width="1"
      opacity="0.8"
      transform="rotate(30)"
    />

    <ellipse
      rx="230"
      ry="190"
      fill="none"
      stroke="#164e63"
      stroke-width="1"
      opacity="0.8"
      transform="rotate(-30)"
    />


    <!-- ================================================= -->
    <!-- CENTER -->
    <!-- ================================================= -->

    <circle
      r="92"
      fill="#020617"
      stroke="#06b6d4"
      stroke-width="2"
      filter="url(#glow)"
    />

    <circle
      r="78"
      fill="#0f172a"
      stroke="#1e3a8a"
      stroke-width="1"
    />

    <text
      x="0"
      y="-8"
      text-anchor="middle"
      fill="#67e8f9"
      font-size="15"
      font-weight="bold"
      letter-spacing="2"
      font-family="Arial">

      TECH STACK

    </text>

    <text
      x="0"
      y="18"
      text-anchor="middle"
      fill="#64748b"
      font-size="9"
      font-family="Arial">

      BUILD • SHIP • CREATE

    </text>


    <!-- ================================================= -->
    <!-- TECHNOLOGY NODES -->
    <!-- ================================================= -->


    <!-- React -->

    <g transform="translate(-300 -105)">
      <circle r="28" fill="#0f172a" stroke="#06b6d4"/>
      <text y="4" text-anchor="middle"
            fill="#67e8f9"
            font-size="10"
            font-weight="bold"
            font-family="Arial">React</text>
    </g>


    <!-- Next.js -->

    <g transform="translate(-175 -190)">
      <circle r="28" fill="#0f172a" stroke="#a78bfa"/>
      <text y="4" text-anchor="middle"
            fill="#f8fafc"
            font-size="10"
            font-weight="bold"
            font-family="Arial">Next.js</text>
    </g>


    <!-- TypeScript -->

    <g transform="translate(0 -215)">
      <circle r="28" fill="#0f172a" stroke="#2563eb"/>
      <text y="4" text-anchor="middle"
            fill="#60a5fa"
            font-size="10"
            font-weight="bold"
            font-family="Arial">TypeScript</text>
    </g>


    <!-- JavaScript -->

    <g transform="translate(175 -190)">
      <circle r="28" fill="#0f172a" stroke="#facc15"/>
      <text y="4" text-anchor="middle"
            fill="#fde047"
            font-size="10"
            font-weight="bold"
            font-family="Arial">JavaScript</text>
    </g>


    <!-- Node.js -->

    <g transform="translate(300 -105)">
      <circle r="28" fill="#0f172a" stroke="#10b981"/>
      <text y="4" text-anchor="middle"
            fill="#34d399"
            font-size="10"
            font-weight="bold"
            font-family="Arial">Node.js</text>
    </g>


    <!-- Express -->

    <g transform="translate(330 25)">
      <circle r="28" fill="#0f172a" stroke="#94a3b8"/>
      <text y="4" text-anchor="middle"
            fill="#e2e8f0"
            font-size="10"
            font-weight="bold"
            font-family="Arial">Express</text>
    </g>


    <!-- PostgreSQL -->

    <g transform="translate(260 145)">
      <circle r="28" fill="#0f172a" stroke="#38bdf8"/>
      <text y="4" text-anchor="middle"
            fill="#38bdf8"
            font-size="9"
            font-weight="bold"
            font-family="Arial">PostgreSQL</text>
    </g>


    <!-- MongoDB -->

    <g transform="translate(120 205)">
      <circle r="28" fill="#0f172a" stroke="#22c55e"/>
      <text y="4" text-anchor="middle"
            fill="#4ade80"
            font-size="10"
            font-weight="bold"
            font-family="Arial">MongoDB</text>
    </g>


    <!-- Tailwind -->

    <g transform="translate(-120 205)">
      <circle r="28" fill="#0f172a" stroke="#22d3ee"/>
      <text y="4" text-anchor="middle"
            fill="#22d3ee"
            font-size="9"
            font-weight="bold"
            font-family="Arial">Tailwind</text>
    </g>


    <!-- Python -->

    <g transform="translate(-260 145)">
      <circle r="28" fill="#0f172a" stroke="#f59e0b"/>
      <text y="4" text-anchor="middle"
            fill="#fbbf24"
            font-size="10"
            font-weight="bold"
            font-family="Arial">Python</text>
    </g>


    <!-- Git -->

    <g transform="translate(-330 25)">
      <circle r="28" fill="#0f172a" stroke="#f43f5e"/>
      <text y="4" text-anchor="middle"
            fill="#fb7185"
            font-size="10"
            font-weight="bold"
            font-family="Arial">Git</text>
    </g>


    <!-- GitHub -->

    <g transform="translate(-180 75)">
      <circle r="28" fill="#0f172a" stroke="#c4b5fd"/>
      <text y="4" text-anchor="middle"
            fill="#ddd6fe"
            font-size="10"
            font-weight="bold"
            font-family="Arial">GitHub</text>
    </g>


    <!-- REST APIs -->

    <g transform="translate(180 75)">
      <circle r="28" fill="#0f172a" stroke="#06b6d4"/>
      <text y="4" text-anchor="middle"
            fill="#67e8f9"
            font-size="9"
            font-weight="bold"
            font-family="Arial">REST APIs</text>
    </g>


    <!-- Prisma -->

    <g transform="translate(0 215)">
      <circle r="28" fill="#0f172a" stroke="#a78bfa"/>
      <text y="4" text-anchor="middle"
            fill="#c4b5fd"
            font-size="10"
            font-weight="bold"
            font-family="Arial">Prisma</text>
    </g>

  </g>


  <!-- ================================================= -->
  <!-- FOOTER -->
  <!-- ================================================= -->

  <text
    x="600"
    y="535"
    text-anchor="middle"
    fill="#475569"
    font-size="8"
    letter-spacing="2"
    font-family="Arial">

    CODE • COLLABORATE • CONTRIBUTE

  </text>


  <path
    d="M30 70 V30 H70"
    fill="none"
    stroke="#06b6d4"
    stroke-width="2"
  />

  <path
    d="M1170 490 V530 H1130"
    fill="none"
    stroke="#a855f7"
    stroke-width="2"
  />

</svg>