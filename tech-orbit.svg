<svg
  width="1200"
  height="500"
  viewBox="0 0 1200 500"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0b1024"/>
      <stop offset="100%" stop-color="#120b24"/>
    </linearGradient>

    <!-- NEON -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- HOLOGRAPHIC -->
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- CARD -->
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#090d1b"/>
    </linearGradient>

    <!-- GOLD -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3a6"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- GRID -->
    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M40 0H0V40"
        fill="none"
        stroke="#334155"
        stroke-opacity="0.15"
      />
    </pattern>

    <!-- GLOW -->
    <filter id="glow">
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- SOFT GLOW -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND                                        -->
  <!-- ================================================= -->

  <rect
    width="1200"
    height="500"
    rx="28"
    fill="url(#bg)"
  />

  <rect
    width="1200"
    height="500"
    rx="28"
    fill="url(#grid)"
  />

  <circle
    cx="80"
    cy="80"
    r="120"
    fill="#22d3ee"
    opacity="0.05"
    filter="url(#softGlow)"
  />

  <circle
    cx="1110"
    cy="410"
    r="140"
    fill="#8b5cf6"
    opacity="0.07"
    filter="url(#softGlow)"
  />


  <!-- ================================================= -->
  <!-- HEADER                                            -->
  <!-- ================================================= -->

  <text
