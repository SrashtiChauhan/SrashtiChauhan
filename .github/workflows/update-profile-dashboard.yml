name: Update Profile Dashboard

on:
  workflow_dispatch:

  schedule:
    # Run approximately once every hour
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-dashboard-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Collect latest GitHub activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          mkdir -p data

          echo "Fetching public repositories..."

          # Fetch all public repositories owned by SrashtiChauhan.
          #
          # --paginate ensures we don't stop at the first page
          # when the account has more than 100 repositories.
          #
          # We sort by pushed_at so the most recently active
          # projects appear first.

          gh api \
            --paginate \
            "users/SrashtiChauhan/repos?per_page=100&type=owner&sort=pushed&direction=desc" \
            --jq '.[] | {
              name: .name,
              full_name: .full_name,
              html_url: .html_url,
              pushed_at: .pushed_at,
              updated_at: .updated_at,
              default_branch: .default_branch,
              stars: .stargazers_count,
              forks: .forks_count
            }' \
            > data/repositories.tmp.jsonl


          echo "Collecting repository activity..."


          # Build the final JSON array.
          echo "[" > data/project-activity.json

          first=true


          while IFS= read -r repository; do

            repo=$(echo "$repository" | jq -r '.name')


            echo "Processing: $repo"


            # Get the latest commit from this repository.

            latest_commit=$(gh api \
              "repos/SrashtiChauhan/$repo/commits?per_page=1" \
              --jq '.[0] | {
                sha: .sha,
                message: .commit.message,
                date: .commit.author.date
              }')


            # Count commits currently visible in the repository.
            #
            # We use pagination so repositories with more than
            # 100 commits are handled correctly.

            commit_count=$(gh api \
              --paginate \
              "repos/SrashtiChauhan/$repo/commits?per_page=100" \
              --jq '.[]' | jq -s 'length')


            project=$(echo "$repository" | jq \
              --argjson commits "$commit_count" \
              --argjson latest "$latest_commit" \
              '. + {
                commit_count: $commits,
                latest_commit: $latest
              }')


            if [ "$first" = false ]; then
              echo "," >> data/project-activity.json
            fi


            echo "$project" >> data/project-activity.json

            first=false

          done < data/repositories.tmp.jsonl


          echo "]" >> data/project-activity.json


          rm data/repositories.tmp.jsonl


          echo ""
          echo "======================================"
          echo "Generated GitHub project activity"
          echo "======================================"
          cat data/project-activity.json


      - name: Commit updated activity data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/project-activity.json


          if git diff --cached --quiet; then

            echo "No activity changes detected."

          else

            git commit -m "chore: update project activity"

            git push

          fi