name: Update Profile Dashboard

on:
  workflow_dispatch:

  schedule:
    # Refresh approximately every hour
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-dashboard-data:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout profile repository
        uses: actions/checkout@v4


      # ==================================================
      # COLLECT GITHUB PROJECT ACTIVITY
      # ==================================================

      - name: Collect latest GitHub project activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          set -e

          mkdir -p data

          echo "=========================================="
          echo "Discovering repositories..."
          echo "=========================================="


          # ==================================================
          # GET ALL REPOSITORIES
          # ==================================================

          gh repo list SrashtiChauhan \
            --limit 100 \
            --json name,nameWithOwner,url,pushedAt,updatedAt,defaultBranchRef,isFork,isArchived,stargazerCount,forkCount \
            > data/all-repositories.json


          echo ""
          echo "Repositories discovered:"
          jq 'length' data/all-repositories.json


          # ==================================================
          # FILTER AND NORMALIZE REPOSITORIES
          #
          # Remove:
          # - profile README repository
          # - forks
          # - archived repositories
          #
          # Sort newest push first.
          # ==================================================

          jq '
            map(
              select(
                .name != "SrashtiChauhan"
                and .isFork == false
                and .isArchived == false
              )
              | {
                  name: .name,
                  full_name: .nameWithOwner,
                  html_url: .url,
                  pushed_at: .pushedAt,
                  updated_at: .updatedAt,
                  default_branch: (.defaultBranchRef.name // "main"),
                  stars: .stargazerCount,
                  forks: .forkCount
                }
            )
            | sort_by(.pushed_at)
            | reverse
          ' \
          data/all-repositories.json \
          > data/active-repositories.json


          echo ""
          echo "=========================================="
          echo "ACTIVE PROJECTS"
          echo "=========================================="


          jq -r '
            .[]
            | "\(.pushed_at)  \(.name)"
          ' data/active-repositories.json


          # ==================================================
          # CREATE PROJECT ACTIVITY JSON
          # ==================================================

          echo "[" > data/project-activity.json

          first=true


          # ==================================================
          # PROCESS EACH PROJECT
          # ==================================================

          while IFS= read -r repository; do

            repo=$(echo "$repository" | jq -r '.name')

            echo ""
            echo "------------------------------------------"
            echo "Processing: $repo"
            echo "------------------------------------------"


            # ==================================================
            # LATEST COMMIT
            # ==================================================

            latest_commit=$(gh api \
              "repos/SrashtiChauhan/$repo/commits?per_page=1" \
              --jq '
                if length > 0 then
                  .[0] | {
                    sha: .sha,
                    message: .commit.message,
                    date: .commit.author.date
                  }
                else
                  {
                    sha: null,
                    message: null,
                    date: null
                  }
                end
              ')


            # ==================================================
            # RECENT COMMITS — LAST 30 DAYS
            # ==================================================

            since=$(date -u -d "30 days ago" +"%Y-%m-%dT%H:%M:%SZ")


            recent_commits=$(gh api \
              --paginate \
              "repos/SrashtiChauhan/$repo/commits?since=$since&per_page=100" \
              --jq '.[]' \
              | jq -s 'length')


            # ==================================================
            # BUILD PROJECT OBJECT
            # ==================================================

            project=$(echo "$repository" | jq \
              --argjson recent_commits "$recent_commits" \
              --argjson latest "$latest_commit" \
              '
              . + {
                recent_commit_count: $recent_commits,
                latest_commit: $latest
              }
              ')


            # ==================================================
            # ADD TO JSON ARRAY
            # ==================================================

            if [ "$first" = false ]; then
              echo "," >> data/project-activity.json
            fi


            echo "$project" >> data/project-activity.json

            first=false

          done < <(
            jq -c '.[]' data/active-repositories.json
          )


          echo "]" >> data/project-activity.json


          # ==================================================
          # BUILD REAL 30-DAY ACTIVITY TIMELINE
          # ==================================================

          echo ""
          echo "=========================================="
          echo "BUILDING ACTIVITY TIMELINE"
          echo "=========================================="


          since=$(date -u -d "30 days ago" +"%Y-%m-%dT%H:%M:%SZ")


          # --------------------------------------------------
          # COLLECT COMMIT DATES FROM ALL ACTIVE REPOSITORIES
          # --------------------------------------------------

          while IFS= read -r repository; do

            repo=$(echo "$repository" | jq -r '.name')

            echo "Collecting commits: $repo"


            gh api \
              --paginate \
              "repos/SrashtiChauhan/$repo/commits?since=$since&per_page=100" \
              --jq '.[] | .commit.author.date'

          done < <(
            jq -c '.[]' data/active-repositories.json
          ) \
          > data/recent-commit-dates.txt


          # --------------------------------------------------
          # CREATE 30-DAY TIMELINE
          # --------------------------------------------------

          echo "[" > data/activity-timeline.json

          first=true


          for offset in $(seq 29 -1 0); do

            date_value=$(date -u -d "$offset days ago" +"%Y-%m-%d")


            # Count real commits for this date.
            if [ -s data/recent-commit-dates.txt ]; then

              commits=$(grep "^$date_value" \
                data/recent-commit-dates.txt \
                | wc -l)

            else

              commits=0

            fi


            point=$(jq -n \
              --arg date "$date_value" \
              --argjson commits "$commits" \
              '{
                date: $date,
                commits: $commits
              }')


            if [ "$first" = false ]; then
              echo "," >> data/activity-timeline.json
            fi


            echo "$point" >> data/activity-timeline.json

            first=false

          done


          echo "]" >> data/activity-timeline.json


          # ==================================================
          # VALIDATE PROJECT DATA
          # ==================================================

          jq empty data/project-activity.json


          # ==================================================
          # VALIDATE TIMELINE DATA
          # ==================================================

          jq empty data/activity-timeline.json


          echo ""
          echo "=========================================="
          echo "PROJECT ACTIVITY GENERATED"
          echo "=========================================="


          jq 'length' data/project-activity.json


          echo ""
          echo "=========================================="
          echo "REAL ACTIVITY TIMELINE GENERATED"
          echo "=========================================="


          jq 'length' data/activity-timeline.json


          echo ""
          jq '.' data/activity-timeline.json


          # ==================================================
          # CLEAN TEMPORARY FILES
          # ==================================================

          rm -f data/all-repositories.json
          rm -f data/active-repositories.json
          rm -f data/recent-commit-dates.txt


      # ==================================================
      # COMMIT UPDATED DATA
      # ==================================================

      - name: Commit updated activity data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/project-activity.json
          git add data/activity-timeline.json


          if git diff --cached --quiet; then

            echo "No activity changes detected."

          else

            git commit \
              -m "chore: update project activity"

            git push

          fi