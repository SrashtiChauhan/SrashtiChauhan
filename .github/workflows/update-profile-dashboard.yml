name: Update Profile Dashboard

on:
  workflow_dispatch:

  schedule:
    # Refresh approximately every hour
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-dashboard-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout profile repository
        uses: actions/checkout@v4


      - name: Collect latest GitHub project activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          mkdir -p data

          echo "Discovering repositories owned by SrashtiChauhan..."


          # --------------------------------------------------
          # DISCOVER ALL REPOSITORIES
          # --------------------------------------------------

          gh repo list SrashtiChauhan \
            --limit 100 \
            --json name,fullName,htmlUrl,pushedAt,updatedAt,defaultBranch,isFork,isArchived,stargazerCount,forkCount \
            > data/all-repositories.json


          # --------------------------------------------------
          # FILTER PROJECTS
          #
          # Exclude:
          # 1. Profile README repository
          # 2. Forked repositories
          # 3. Archived repositories
          # --------------------------------------------------

          jq '
            map(
              select(
                .name != "SrashtiChauhan"
                and .isFork == false
                and .isArchived == false
              )
            )
            | sort_by(.pushedAt)
            | reverse
          ' \
          data/all-repositories.json \
          > data/active-repositories.json


          echo ""
          echo "=========================================="
          echo "ACTIVE PROJECTS DISCOVERED"
          echo "=========================================="

          jq -r '
            .[]
            | "\(.pushedAt)  \(.name)"
          ' data/active-repositories.json


          # --------------------------------------------------
          # CREATE ACTIVITY DATA
          # --------------------------------------------------

          echo "[" > data/project-activity.json

          first=true


          while IFS= read -r repository; do

            repo=$(echo "$repository" | jq -r '.name')


            echo ""
            echo "Processing: $repo"


            # ------------------------------------------------
            # LATEST COMMIT
            # ------------------------------------------------

            latest_commit=$(gh api \
              "repos/SrashtiChauhan/$repo/commits?per_page=1" \
              --jq '.[0] | {
                sha: .sha,
                message: .commit.message,
                date: .commit.author.date
              }')


            # ------------------------------------------------
            # RECENT COMMIT COUNT
            #
            # Count commits from the last 30 days.
            # This gives us useful real activity for the
            # analytics graph instead of a fake number.
            # ------------------------------------------------

            since=$(date -u -d "30 days ago" +"%Y-%m-%dT%H:%M:%SZ")


            recent_commits=$(gh api \
              --paginate \
              "repos/SrashtiChauhan/$repo/commits?since=$since&per_page=100" \
              --jq '.[]' \
              | jq -s 'length')


            # ------------------------------------------------
            # BUILD PROJECT OBJECT
            # ------------------------------------------------

            project=$(echo "$repository" | jq \
              --argjson recent_commits "$recent_commits" \
              --argjson latest "$latest_commit" \
              '. + {
                recent_commit_count: $recent_commits,
                latest_commit: $latest
              }')


            if [ "$first" = false ]; then
              echo "," >> data/project-activity.json
            fi


            echo "$project" >> data/project-activity.json

            first=false

          done < <(
            jq -c '.[]' data/active-repositories.json
          )


          echo "]" >> data/project-activity.json


          # --------------------------------------------------
          # CLEAN TEMPORARY FILES
          # --------------------------------------------------

          rm data/all-repositories.json
          rm data/active-repositories.json


          echo ""
          echo "=========================================="
          echo "FINAL PROJECT ACTIVITY"
          echo "=========================================="

          cat data/project-activity.json


      # ----------------------------------------------------
      # SAVE UPDATED DATA
      # ----------------------------------------------------

      - name: Commit updated activity data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/project-activity.json


          if git diff --cached --quiet; then

            echo "No activity changes detected."

          else

            git commit \
              -m "chore: update project activity"

            git push

          fi