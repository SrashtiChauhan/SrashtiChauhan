<svg
  width="1200"
  height="560"
  viewBox="0 0 1200 560"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0b1024"/>
      <stop offset="100%" stop-color="#120b24"/>
    </linearGradient>

    <!-- Neon cyan/purple gradient -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Glass card gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172033" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#090d1a" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 40 0 L 0 0 0 40"
        fill="none"
        stroke="#334155"
        stroke-opacity="0.18"
        stroke-width="1"
      />
    </pattern>

    <!-- Clip for avatar -->
    <clipPath id="avatarClip">
      <circle cx="930" cy="270" r="175"/>
    </clipPath>

  </defs>


  <!-- ====================================================== -->
  <!-- BACKGROUND                                             -->
  <!-- ====================================================== -->

  <rect
    width="1200"
    height="560"
    rx="28"
    fill="url(#bg)"
  />

  <!-- Grid -->
  <rect
    width="1200"
    height="560"
    rx="28"
    fill="url(#grid)"
  />


  <!-- ====================================================== -->
  <!-- AMBIENT NEON ORBS                                      -->
  <!-- ====================================================== -->

  <circle
    cx="110"
    cy="90"
    r="120"
    fill="#2563eb"
    opacity="0.10"
    filter="url(#strongGlow)"
  />

  <circle
    cx="1080"
    cy="470"
    r="160"
    fill="#a855f7"
    opacity="0.12"
    filter="url(#strongGlow)"
  />


  <!-- ====================================================== -->
  <!-- MOVING ORBIT                                          -->
  <!-- ====================================================== -->

  <g
    fill="none"
    stroke="url(#neon)"
    stroke-width="2"
    opacity="0.65"
  >

    <ellipse
      cx="930"
      cy="270"
      rx="225"
      ry="90"
      transform="rotate(-18 930 270)"
    >
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="-18 930 270"
        to="342 930 270"
        dur="18s"
        repeatCount="indefinite"
      />
    </ellipse>

    <ellipse
      cx="930"
      cy="270"
      rx="215"
      ry="125"
      transform="rotate(48 930 270)"
      opacity="0.45"
    >
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="48 930 270"
        to="408 930 270"
        dur="24s"
        repeatCount="indefinite"
      />
    </ellipse>

  </g>


  <!-- ====================================================== -->
  <!-- STATUS                                                -->
  <!-- ====================================================== -->

  <rect
    x="70"
    y="58"
    width="190"
    height="34"
    rx="17"
    fill="#07151c"
    stroke="#22d3ee"
    stroke-opacity="0.55"
  />

  <circle
    cx="92"
    cy="75"
    r="6"
    fill="#10b981"
  >

    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="1.8s"
      repeatCount="indefinite"
    />

  </circle>

  <text
    x="108"
    y="81"
    fill="#67e8f9"
    font-family="monospace"
    font-size="14"
    letter-spacing="2"
  >
    SYSTEM ONLINE
  </text>


  <!-- ====================================================== -->
  <!-- MAIN TEXT                                             -->
  <!-- ====================================================== -->

  <text
    x="70"
    y="170"
    fill="#94a3b8"
    font-family="monospace"
    font-size="16"
    letter-spacing="4"
  >
    HELLO, I'M
  </text>

  <text
    x="68"
    y="225"
    fill="#f8fafc"
    font-family="Arial, sans-serif"
    font-size="54"
    font-weight="800"
    letter-spacing="-2"
  >
    SRASHTI CHAUHAN
  </text>

  <!-- Neon underline -->

  <rect
    x="70"
    y="244"
    width="430"
    height="3"
    rx="2"
    fill="url(#neon)"
  >

    <animate
      attributeName="width"
      values="100;430;100"
      dur="5s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- ====================================================== -->
  <!-- ROLE                                                  -->
  <!-- ====================================================== -->

  <text
    x="70"
    y="300"
    fill="#22d3ee"
    font-family="monospace"
    font-size="18"
    font-weight="700"
  >
    &gt; ASPIRING SOFTWARE DEVELOPER
  </text>

  <text
    x="70"
    y="332"
    fill="#c4b5fd"
    font-family="monospace"
    font-size="15"
  >
    AI • FULL STACK • OPEN SOURCE
  </text>


  <!-- ====================================================== -->
  <!-- TERMINAL CARD                                         -->
  <!-- ====================================================== -->

  <rect
    x="68"
    y="380"
    width="510"
    height="110"
    rx="16"
    fill="url(#glass)"
    stroke="#475569"
    stroke-opacity="0.6"
  />

  <!-- Terminal dots -->

  <circle cx="90" cy="404" r="5" fill="#f43f5e"/>
  <circle cx="108" cy="404" r="5" fill="#f59e0b"/>
  <circle cx="126" cy="404" r="5" fill="#10b981"/>

  <text
    x="90"
    y="435"
    fill="#64748b"
    font-family="monospace"
    font-size="13"
  >
    ~/srashti/dev
  </text>

  <text
    x="90"
    y="462"
    fill="#22d3ee"
    font-family="monospace"
    font-size="14"
  >
    $ build --future
  </text>

  <text
    x="250"
    y="462"
    fill="#10b981"
    font-family="monospace"
    font-size="14"
  >
    ✓ ready
  </text>


  <!-- ====================================================== -->
  <!-- AVATAR FRAME                                          -->
  <!-- ====================================================== -->

  <circle
    cx="930"
    cy="270"
    r="185"
    fill="none"
    stroke="url(#neon)"
    stroke-width="2"
    opacity="0.35"
  />

  <circle
    cx="930"
    cy="270"
    r="178"
    fill="#020617"
    stroke="#22d3ee"
    stroke-opacity="0.35"
  />


  <!-- Avatar -->

  <image
    href="assets/avatar.png"
    x="755"
    y="95"
    width="350"
    height="350"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#avatarClip)"
  />


  <!-- ====================================================== -->
  <!-- FLOATING TECH LABELS                                   -->
  <!-- ====================================================== -->

  <g font-family="monospace" font-size="12">

    <rect
      x="760"
      y="80"
      width="82"
      height="28"
      rx="14"
      fill="#07151c"
      stroke="#22d3ee"
      stroke-opacity="0.6"
    />

    <text
      x="779"
      y="99"
      fill="#67e8f9"
    >
      AI
    </text>


    <rect
      x="1010"
      y="135"
      width="105"
      height="28"
      rx="14"
      fill="#110b20"
      stroke="#a78bfa"
      stroke-opacity="0.6"
    />

    <text
      x="1030"
      y="154"
      fill="#c4b5fd"
    >
      FULL STACK
    </text>


    <rect
      x="745"
      y="455"
      width="120"
      height="28"
      rx="14"
      fill="#110b20"
      stroke="#f472b6"
      stroke-opacity="0.6"
    />

    <text
      x="765"
      y="474"
      fill="#f9a8d4"
    >
      OPEN SOURCE
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- SCANNER LINE                                          -->
  <!-- ====================================================== -->

  <rect
    x="760"
    y="270"
    width="340"
    height="2"
    fill="#22d3ee"
    opacity="0.65"
    filter="url(#glow)"
  >

    <animate
      attributeName="y"
      values="105;435;105"
      dur="4s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- ====================================================== -->
  <!-- BORDER                                                -->
  <!-- ====================================================== -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="558"
    rx="28"
    fill="none"
    stroke="url(#neon)"
    stroke-width="2"
    opacity="0.65"
  />

</svg>